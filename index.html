    <script>
      window.dataLayer = window.dataLayer || [];

        document.head.appendChild(gaScript);

        gtag('js', new Date());
        gtag('config', 'G-X5FXLBDMW7', { send_page_view: false });
      }

      // Initialize on first mobile interaction, or after 3.5s idle fallback
      ['touchstart', 'scroll', 'click', 'keydown'].forEach(function(evt) {
        window.addEventListener(evt, initAnalytics, { once: true, passive: true });
      });
      window.addEventListener('load', function() {
        setTimeout(initAnalytics, 3500);
      });
    </script>
